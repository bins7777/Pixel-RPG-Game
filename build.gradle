ext {
    gdxVersion = "1.12.1"
}

def localBuildRoot = new File(
    System.getenv("LOCALAPPDATA") ?: System.getProperty("java.io.tmpdir"),
    "pixelrpg-gradle-build"
)

allprojects { p ->
    p.buildDir = new File(localBuildRoot, p.name)

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
